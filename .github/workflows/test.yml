name: test

# Runs tools/test.sh on Linux. Kept light on minutes: changes that only touch
# documentation don't run it, a newer push cancels the run before it, and the
# OpenSCAD download is cached between runs.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/setup.sh
      - name: Cache OpenSCAD
        uses: actions/cache@v4
        with:
          path: ~/.local/opt
          key: openscad-${{ runner.os }}-${{ hashFiles('tools/setup.sh') }}
      - name: Set up (OpenSCAD, Python packages)
        timeout-minutes: 8   # a mirror outage should cost minutes, not the whole job
        run: tools/setup.sh
      - name: Test
        run: tools/test.sh
