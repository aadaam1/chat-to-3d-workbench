<style>
  /* One page, two layouts over the same controls.
     Studio (the default): the part under a warm spotlight in its real material,
     and under it the bar you talk to Claude with. Nothing else until asked for.
     Advanced: a drawing sheet. Title block on top, view rail, sizes and lettered
     check notes drawn on the part, a revision table along the bottom.
     In both, the checks, the material and the comment list live in one side
     sheet. Folded (as it starts in Studio) it is a narrow strip of icons with
     the verdict on it; its chevron slides it open and shut. A comment is
     written in a bubble at its pin, and "Looks good" is always top right.
     Tokens first: Studio dark on bare :root, then its light theme, then Advanced. */
  :root {
    --bg: #0a1017; --bg2: #172330; --glow: rgba(255,176,110,.2); --surface: rgba(18,27,37,.72); --solid: #131d28;
    --ink: #f3eee7; --muted: #a0acb8; --line: rgba(255,255,255,.12); --hair: rgba(255,255,255,.07); --grid: transparent;
    --accent: #f29a6c; --on-accent: #2a1206; --pin: #62d9ff; --on-pin: #03222e;
    --ok: #72d9a5; --amber: #f6bd45; --red: #ff7468;
    --good3d: #5f9c88; --amber3d: #f2b233; --red3d: #f0554a; --cut: #b56f4e; --clay: #f2f2ee; --edge: #13224a;
    --display: "Red Hat Display", "Avenir Next", system-ui, sans-serif;
    --body: "Red Hat Text", system-ui, -apple-system, sans-serif;
    --mono: "Red Hat Mono", ui-monospace, Menlo, monospace;
    --r: 16px; --r2: 10px; --shadow: 0 20px 50px -20px rgba(0,0,0,.7); color-scheme: dark;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    --bg: #dfe4ea; --bg2: #f4f6f8; --glow: rgba(255,255,255,.9); --surface: rgba(255,255,255,.74); --solid: #ffffff;
    --ink: #161c23; --muted: #55616f; --line: rgba(22,28,35,.14); --hair: rgba(22,28,35,.08);
    --accent: #b24a1c; --on-accent: #ffffff; --pin: #0a6f96; --on-pin: #ffffff;
    --ok: #17734f; --amber: #946100; --red: #c2352a; --good3d: #8fbba6;
    --shadow: 0 16px 40px -18px rgba(20,30,45,.35); color-scheme: light } }
  :root[data-theme="light"] {
    --bg: #dfe4ea; --bg2: #f4f6f8; --glow: rgba(255,255,255,.9); --surface: rgba(255,255,255,.74); --solid: #ffffff;
    --ink: #161c23; --muted: #55616f; --line: rgba(22,28,35,.14); --hair: rgba(22,28,35,.08);
    --accent: #b24a1c; --on-accent: #ffffff; --pin: #0a6f96; --on-pin: #ffffff;
    --ok: #17734f; --amber: #946100; --red: #c2352a; --good3d: #8fbba6;
    --shadow: 0 16px 40px -18px rgba(20,30,45,.35); color-scheme: light }
  :root[data-view="advanced"] {
    --bg: #e8ecf2; --bg2: #e8ecf2; --glow: transparent; --surface: #fafbfd; --solid: #fafbfd;
    --ink: #13224a; --muted: #55638a; --line: rgba(19,34,74,.26); --hair: rgba(19,34,74,.12); --grid: rgba(29,58,138,.07);
    --accent: #1d47c9; --on-accent: #ffffff; --pin: #7a2fe0; --on-pin: #ffffff;
    --ok: #17734f; --amber: #9a6500; --red: #c62f2f;
    --good3d: #b9cfe6; --amber3d: #e8a51e; --red3d: #dc4038; --cut: #c5d1ea; --clay: #f6f6f2; --edge: #13224a;
    --display: "Archivo Narrow", "Arial Narrow", sans-serif; --body: "Archivo", system-ui, sans-serif; --mono: "DM Mono", ui-monospace, Menlo, monospace;
    --r: 0px; --r2: 0px; --shadow: none; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root[data-view="advanced"]:not([data-theme="light"]) {
    --bg: #081a31; --bg2: #081a31; --surface: #0d2747; --solid: #0d2747;
    --ink: #eaf1ff; --muted: #a3b9dc; --line: rgba(234,241,255,.34); --hair: rgba(234,241,255,.14); --grid: rgba(234,241,255,.055);
    --accent: #9ccbff; --on-accent: #06203d; --pin: #ffd640; --on-pin: #2b2200;
    --ok: #7fe0b2; --amber: #ffc24a; --red: #ff8479;
    --good3d: #4f86c4; --amber3d: #ffbe3b; --red3d: #ff6a5e; --cut: #173d6c; --clay: #3f76b8; --edge: #eaf1ff; color-scheme: dark } }
  :root[data-view="advanced"][data-theme="dark"] {
    --bg: #081a31; --bg2: #081a31; --surface: #0d2747; --solid: #0d2747;
    --ink: #eaf1ff; --muted: #a3b9dc; --line: rgba(234,241,255,.34); --hair: rgba(234,241,255,.14); --grid: rgba(234,241,255,.055);
    --accent: #9ccbff; --on-accent: #06203d; --pin: #ffd640; --on-pin: #2b2200;
    --ok: #7fe0b2; --amber: #ffc24a; --red: #ff8479;
    --good3d: #4f86c4; --amber3d: #ffbe3b; --red3d: #ff6a5e; --cut: #173d6c; --clay: #3f76b8; --edge: #eaf1ff; color-scheme: dark }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--ink); font: 15px/1.45 var(--body);
    background: radial-gradient(40% 46% at 50% 48%, var(--glow), transparent 72%), linear-gradient(var(--bg2), var(--bg) 70%) var(--bg);
    padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  button, textarea, input, output { font: inherit; color: inherit; }
  button { cursor: pointer; } button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, p, ol, ul, dl, dd { margin: 0; } ol, ul { padding: 0; list-style: none; }
  .lbl, h2 { font: 700 12px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .glass { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
    backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2); }

  /* ---------- frame ---------- */
  .app { --sw: 56px; height: 100%; min-height: 620px; display: grid; gap: 12px 16px;
    grid-template: "top top" auto "stage sheet" minmax(0, 1fr) "feed sheet" auto / minmax(0, 1fr) var(--sw);
    transition: grid-template-columns .3s cubic-bezier(.2, .7, .2, 1); }
  .app.open { --sw: 340px; }
  .app > * { min-width: 0; }
  .top { grid-area: top; display: flex; align-items: flex-start; gap: 12px 20px; flex-wrap: wrap; }
  .ttl { flex: 1 1 260px; min-width: 0; }
  h1 { font: 900 clamp(22px, 2.6vw, 30px)/1.05 var(--display); letter-spacing: -.015em; text-wrap: balance; }
  .sub { margin-top: 4px; color: var(--muted); font-size: 14px; }
  .cells { display: none; }
  .topact { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stage { grid-area: stage; position: relative; min-height: 0; }
  .feed { grid-area: feed; } .hist { grid-area: hist; }
  /* the side sheet: a strip of icons when folded, the full sheet when open */
  .sheet { grid-area: sheet; min-height: 0; overflow: hidden; position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .sheethead { display: flex; align-items: center; gap: 10px; padding: 11px; min-width: 0; }
  .chev { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: none; color: var(--ink); }
  .chev:hover { border-color: var(--accent); color: var(--accent); }
  .chev svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transform: rotate(180deg); transition: transform .3s; }
  .open .chev svg { transform: none; }
  .sheethead .stamp { white-space: nowrap; opacity: 0; transition: opacity .2s; }
  .open .sheethead .stamp { opacity: 1; }
  .mini { position: absolute; top: 58px; left: 0; width: 54px; display: grid; justify-items: center; gap: 6px; transition: opacity .2s; }
  .open .mini { opacity: 0; visibility: hidden; }
  .mini button { position: relative; width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: var(--r2); background: none; color: var(--muted); }
  .mini button:hover { color: var(--ink); background: var(--hair); }
  .mini svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .mini .dot { position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; box-shadow: 0 0 0 2px var(--solid); }
  .mini .n { position: absolute; top: 0; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--pin); color: var(--on-pin); font: 500 10.5px/16px var(--mono); }
  .mini .n:empty { display: none; }
  .sheetbody { width: 338px; min-height: 0; overflow-y: auto; padding: 4px 16px 16px; display: grid; gap: 14px; align-content: start; transition: opacity .2s, visibility 0s; }
  .app:not(.open) .sheetbody { opacity: 0; visibility: hidden; transition: opacity .2s, visibility 0s .2s; }
  .sheetbody > * { display: grid; gap: 10px; }
  .sheetbody > * + * { padding-top: 14px; border-top: 1px solid var(--line); }
  .sheetbody .hist { grid-area: auto; background: none; border-width: 1px 0 0; border-radius: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }

  /* ---------- small controls ---------- */
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); max-width: 100%; flex-wrap: wrap; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 7px 13px; font-weight: 500; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .linkish { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none; display: inline-block; }
  .check > .dot, .dot.check { background: var(--amber); } .fix > .dot, .fail > .dot, .dot.fix, .dot.fail { background: var(--red); }

  /* ---------- stage ---------- */
  .cv { position: absolute; inset: 0; }
  #view { position: absolute; inset: 0; overflow: hidden; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #view.pinning canvas { cursor: crosshair; } #view.pinning.onpart canvas { cursor: none; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); pointer-events: none; text-align: center; padding: 16px; }
  #pinlayer, #ov { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #ov { width: 100%; height: 100%; }
  #ov line { stroke: var(--accent); stroke-width: 1.1; fill: none; } #ov .ext { stroke-dasharray: 2 3; opacity: .7; }
  #ov text { font: 500 13px var(--mono); fill: var(--accent); paint-order: stroke; stroke: var(--solid); stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; dominant-baseline: middle; }
  #ov .bal circle { fill: var(--solid); stroke: var(--amber); stroke-width: 1.8; } #ov .bal line { stroke: var(--amber); }
  #ov .bal.fix circle, #ov .bal.fix line { stroke: var(--red); }
  #ov .bal text { fill: var(--ink); font: 700 13px var(--display); stroke: none; } #ov .off { opacity: .25; }
  .pinlab { position: absolute; transform: translate(-50%, -50%); min-width: 22px; height: 22px; padding: 0 6px; border: 0; border-radius: 11px; background: var(--pin); color: var(--on-pin); pointer-events: auto; cursor: pointer;
    font: 500 12px/22px var(--mono); text-align: center; box-shadow: 0 0 0 4px color-mix(in srgb, var(--pin) 28%, transparent); transition: opacity .15s ease-out; }
  span.pinlab { pointer-events: none; }
  .bubble { position: absolute; width: 252px; padding: 10px; display: grid; gap: 8px; pointer-events: auto; z-index: 3; background: var(--solid); border: 1px solid var(--line); border-radius: var(--r2); box-shadow: var(--shadow); }
  .bubble b { font: 700 12px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .bubble textarea { width: 100%; height: 62px; resize: none; border: 1px solid var(--line); border-radius: var(--r2); background: none; padding: 7px 9px; font-size: 14.5px; line-height: 1.4; }
  .bubble textarea::placeholder { color: var(--muted); }
  .bubble .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pinlab.behind { opacity: .3; } .pinlab.ghost { opacity: .75; } .pinlab.hot { transform: translate(-50%, -50%) scale(1.25); }

  .bar { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 14px; pointer-events: none; }
  .bar > * { pointer-events: auto; } .grp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .statusbox { position: absolute; top: calc(var(--bar-bottom, 0px) + 8px); left: 0; right: 0; display: grid; justify-items: end; pointer-events: none; z-index: 2; }
  .status { pointer-events: auto; display: grid; gap: 5px; padding: 9px 12px; font-size: 13px; max-width: 46ch; border-radius: var(--r2); }
  .status .head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .status p { color: var(--muted); } .status .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .key { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); }
  .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }

  .rail { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); display: flex; padding: 3px; gap: 2px; border-radius: 999px; max-width: 100%; z-index: 2; }
  .rail button { border: 0; background: none; border-radius: 999px; padding: 7px 12px; font-weight: 500; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
  .rail button svg { display: none; } .rail button:hover { color: var(--ink); }
  .rail button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .rail .gap { width: 1px; margin: 5px 4px; background: var(--line); }
  .cutrow { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); width: min(380px, 100%); display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); }
  .cutrow input { flex: 1; min-width: 0; accent-color: var(--accent); }
  .cutrow output { font: 13px var(--mono); min-width: 5ch; text-align: right; font-variant-numeric: tabular-nums; }

  /* builds: a second slider pulls the structure apart, above the cut slider */
  .exprow { bottom: 30px; } .build .rail { bottom: 76px; }
  [data-view="advanced"] .exprow { bottom: 40px; } [data-view="advanced"] .build .rail { bottom: auto; }
  .status .id { font: 12px var(--mono); }
  .build .mats button span { white-space: normal; text-align: right; }

  /* ---------- history ---------- */
  .time { display: grid; }
  .time button { width: 100%; border: 0; background: none; text-align: left; display: grid; grid-template-columns: 18px 1fr; gap: 0 10px; padding: 0 0 14px; position: relative; color: var(--muted); }
  .time button::before { content: ""; width: 12px; height: 12px; margin: 4px 3px 0; border-radius: 50%; border: 2px solid var(--muted); background: var(--solid); z-index: 1; }
  .time li:not(:last-child) button::after { content: ""; position: absolute; left: 8px; top: 16px; bottom: -4px; width: 2px; background: var(--line); }
  .time b { font: 700 15px/1.3 var(--display); } .time small { grid-column: 2; font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
  .time button[aria-current="true"] { color: var(--ink); } .time button[aria-current="true"]::before { border-color: var(--accent); background: var(--accent); }
  .time .more { color: var(--muted); font-size: 13px; padding-left: 28px; }
  .switch { display: flex; align-items: center; gap: 10px; font-size: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .switch input { appearance: none; -webkit-appearance: none; width: 36px; height: 21px; border-radius: 11px; background: color-mix(in srgb, var(--ink) 22%, transparent); position: relative; flex: none; margin: 0; cursor: pointer; transition: background .2s; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--solid); transition: transform .2s; }
  .switch input:checked { background: var(--accent); } .switch input:checked::after { transform: translateX(15px); }
  .switch input:disabled { opacity: .4; cursor: default; }

  /* ---------- the sheet: checks, material, comments ---------- */
  details summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); }
  details ul { margin-top: 6px; padding-left: 16px; list-style: disc; display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
  details p { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .stamp { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; }
  .stampnote { color: var(--muted); font-size: 11.5px; line-height: 1.4; margin: 2px 0 0; }
  .sheetbody > .stampnote { display: block; margin: 0 0 -4px; }
  .sheetbody > .stampnote + * { border-top: 0; padding-top: 0; }
  .cell .stampnote { display: block; max-width: 230px; }
  .checks { display: grid; gap: 4px; }
  .chk { border: 1px solid transparent; background: none; border-radius: var(--r2); text-align: left; padding: 8px 10px; display: grid; grid-template-columns: 22px 1fr; gap: 1px 8px; align-items: baseline; }
  .chk .dot { align-self: center; justify-self: center; }
  .chk .tag { width: 22px; height: 22px; border-radius: 50%; border: 1.8px solid var(--amber); font: 700 12px/19px var(--display); text-align: center; align-self: start; }
  .chk.fix .tag { border-color: var(--red); }
  /* a passing check is one line that opens on click; findings stay open */
  .chksum { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chk.fold { display: block; padding: 0; }
  .chk-h { width: 100%; border: 0; background: none; text-align: left; padding: 5px 10px; border-radius: var(--r2); display: grid; grid-template-columns: 22px minmax(0, 1fr) 12px; gap: 0 8px; align-items: center; }
  .chk-h:hover { background: var(--hair); }
  .chk-h .dot { justify-self: center; }
  .chk-h .caret { width: 7px; height: 7px; border: solid var(--muted); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg) translate(-2px, -2px); transition: transform .2s; }
  .chk-h[aria-expanded="true"] .caret { transform: rotate(-135deg) translate(-2px, -2px); }
  .chk-body { display: grid; justify-items: start; gap: 4px; padding: 0 10px 8px 40px; }
  .chk .chk-body small { grid-column: 1; color: var(--muted); font-size: 13px; line-height: 1.35; }
  .chk-act { border: 0; background: none; padding: 0; font: 600 12.5px/1.3 var(--body); color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .chk-act[aria-pressed="true"] { font-size: 0; } .chk-act[aria-pressed="true"]::after { content: "Back to plain"; font-size: 12.5px; }
  .plan { display: grid; gap: 8px; font-size: 13.5px; line-height: 1.4; }
  .plan span { color: var(--muted); }
  .chk b { font-weight: 600; } .chk small { grid-column: 2; color: var(--muted); font-size: 13px; line-height: 1.35; }
  .chk em { grid-column: 2; font-style: normal; font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  button.chk:hover { border-color: var(--line); } .chk[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .chk[aria-pressed="true"] em { font-size: 0; } .chk[aria-pressed="true"] em::after { content: "Back to plain"; font-size: 12.5px; }
  .specs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; margin-top: 8px; font-size: 13px; }
  .specs dt { color: var(--muted); } .specs dd { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .mats { display: grid; gap: 4px; }
  .mats button { border: 1px solid transparent; background: none; border-radius: var(--r2); padding: 7px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; text-align: left; }
  .mats button b { font-weight: 600; } .mats button span { font: 13px var(--mono); color: var(--muted); white-space: nowrap; }
  .mats button:hover { border-color: var(--line); }
  .mats button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .calc { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  for (const L of labels) {
    L.el.hidden = !put(L.headAt, L.el) || (cutOn() && L.foot.x > clip.constant);
    if (checkOcclusion && mesh && !L.el.hidden) {
      // a label is "behind" when the part is between the camera and the comment
      dir.subVectors(L.foot, camera.position); const dist = dir.length(); dir.normalize();
      ray.set(camera.position, dir);
      const firstHit = ray.intersectObjects(targets(), false).find(hh => !cutOn() || hh.point.x <= clip.constant + 1e-6);
      L.el.classList.toggle('behind', !!firstHit && firstHit.distance < dist - lastSpan * 0.01);
    }
  }
  if (bubble) {
    const L = labels.find(l => l.id === editing);
    bubble.hidden = !L || L.el.hidden;
    if (L && put(L.headAt, bubble)) bubble.style.transform = tmp.x > 0.25 ? 'translate(calc(-100% - 18px), -50%)' : 'translate(18px, -50%)';
  }
  if (!ghostLabel.hidden && ghost.visible) {
    const top = ghost.localToWorld(new THREE.Vector3(0, ghost.children[1]?.position.y ?? 0, 0));
    put(top, ghostLabel);
  }
}

function pinsChanged() {
  pins.sort((a, b) => a.n - b.n);
  drawPins(); renderList(); refreshActions();
}

function renderList() {
  const v = V[vi], list = $('pinlist');
  const focused = document.activeElement?.id, sel = document.activeElement?.selectionStart;
  $('pins-h').textContent = v.n ? `Your comments on version ${v.n}` : 'Your comments';
  list.replaceChildren(); $('pins-empty').hidden = pins.length > 0;
  const multi = V[vi].parts.length > 1;
  for (const p of pins) {
    const li = el('li', 'pin' + (p.id === hot ? ' hot' : ''));
    li.dataset.id = p.id;
    const num = el('span', 'num', p.n); num.setAttribute('aria-hidden', 'true');
    const x = el('button', 'x', 'Remove');
    x.type = 'button'; x.disabled = !store.canWrite;
    x.setAttribute('aria-label', `Remove comment ${p.n}`);
    x.addEventListener('click', () => removePin(p));
    const note = el('textarea');
    note.id = 'note-' + p.id; note.rows = 1;
    note.placeholder = 'What should change here?';
    note.value = drafts.get(p.id) ?? p.note ?? '';
    note.readOnly = !store.canWrite;
    note.setAttribute('aria-label', `Comment ${p.n}`);
    note.addEventListener('input', () => { noteInput(p.id, note.value); const b = $('bub-' + p.id); if (b) b.value = note.value; });
    note.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); view.focus({ preventScroll: true }); } });
    const meta = el('span', 'meta');
    meta.innerHTML = `<span>${p.member ? esc(p.member) + ' · ' : multi ? esc(partName(p.part)) + ' · ' : ''}x ${p.x}  y ${p.y}  z ${p.z} mm</span>` +
      `<span class="saved" id="saved-${esc(p.id)}" ${saved.has(p.id) ? '' : 'hidden'}>Saved</span>` +
      (p.sent ? '<span>Sent to Claude</span>' : '');
    li.addEventListener('mouseenter', () => highlight(p.id));
    li.addEventListener('mouseleave', () => highlight(null));
    li.addEventListener('focusin', () => highlight(p.id));
    li.append(num, note, x, meta);
    list.append(li);
  }
  if (editing && !pins.some(p => p.id === editing)) { bubble.remove(); bubble = null; editing = null; }
  if (focusNew && pins.some(p => p.id === focusNew)) {
    const id = focusNew; focusNew = null; openBubble(id);       // write the note right at the pin
  } else if (focused && $(focused)) {
    $(focused).focus({ preventScroll: true }); try { $(focused).setSelectionRange(sel, sel); } catch {}
  }
}
function highlight(id) {
  if (hot === id) return;
  hot = id; drawPins();
  [...$('pinlist').children].forEach(li => li.classList.toggle('hot', !!id && li.dataset.id === id));
}

let undoTimer = null;
function removePin(p) {
  if (!store.db) { pins = pins.filter(q => q.id !== p.id); pinsChanged(); }
  store.del(p.id).catch(writeFailed);
  const c = $('confirm');
  c.className = 'confirm'; c.hidden = false;
  c.innerHTML = `Comment ${p.n} removed. <button class="linkish" type="button" id="undo">Undo</button>`;
  $('undo').addEventListener('click', () => {
    const { id, ...pin } = p;
    if (drafts.has(id)) pin.note = drafts.get(id);
    if (!store.db) { pins.push(p); pinsChanged(); }
    store.put(pin).catch(writeFailed);
    c.hidden = true;
  });
  clearTimeout(undoTimer); undoTimer = setTimeout(() => { c.hidden = true; }, 8000);
}

/* ---------- handing it to Claude: next version, or the print files ---------- */
let comments = null, canSend = 'off';
const where = () => { const v = V[vi]; return `${D.title}${v.n ? `, version v${v.n}` : ''}${v.note ? ` (${v.note})` : ''}`; };
function pinsText() {
  const multi = V[vi].parts.length > 1, say = $('say').value.trim();
  const lines = pins.map(p => {
    const note = (drafts.get(p.id) ?? p.note ?? '').trim();
    return `Comment ${p.n}${p.member ? ` on ${p.member}` : multi ? ` on ${partName(p.part)}` : ''} at x ${p.x}, y ${p.y}, z ${p.z}${note ? `: ${note}` : ''}`;
  });
  const head = `Feedback on ${where()}.` + (pins.length ? ` ${pins.length} comment${pins.length > 1 ? 's' : ''} on the part, in model millimetres:` : '');
  return [head, ...lines, ...(say ? [(pins.length ? 'About the whole part: ' : '') + say] : []), '', 'Please make the next version.'].join('\n');
}
function approveText() {
  if (BUILD) return `${where()} looks good. Please make the shopping list and the cut list.`;
  const parts = V[vi].parts.map(p => partName(p.label)).join(', ');
  const m = mat === BUILT ? `in ${P().name}` : `in ${P().name} (this version was drawn for ${PROCS[BUILT].name}, so adjust it for the new material)`;
  return `${where()} looks good. Please make the print files (STL and STEP) ${m} for: ${parts}.`;
}
function refreshActions() {
  const direct = canSend === 'available', send = $('send');
  const k = pins.length;
  $('mini-n').textContent = k || '';
  send.disabled = !k && !$('say').value.trim();
  send.textContent = direct ? (k ? `Send ${k} comment${k > 1 ? 's' : ''} to Claude` : 'Send to Claude') : (k ? `Copy ${k} comment${k > 1 ? 's' : ''} for the chat` : 'Copy for the chat');
}
$('say').addEventListener('input', refreshActions);
function confirmMsg(html, kind = 'ok') {
  const c = $('confirm');
  c.className = 'confirm ' + kind; c.innerHTML = html; c.hidden = false;
  clearTimeout(undoTimer);
}
function copyOut(text) {
  const boxEl = $('copybox');
  const fallback = () => {
    boxEl.hidden = false; boxEl.value = text; boxEl.focus(); boxEl.select();
    confirmMsg('Select all of the text below and copy it into the chat.', 'warn');
  };
  if (!navigator.clipboard?.writeText) return fallback();
  navigator.clipboard.writeText(text).then(() => {
    boxEl.hidden = true;
    confirmMsg('Copied. Paste it into the chat with Claude (⌘V or Ctrl+V).');
  }, fallback);
}
async function deliver(text, button, done) {
  if (canSend !== 'available' || !comments) return copyOut(text);
  const was = button.textContent;
  button.disabled = true; button.textContent = 'Sending…';
  try {
    const anchor = await comments.anchorFor($('feed'));
    await comments.sendToClaude({ anchor, text });
    confirmMsg(done);
    return true;
  } catch (e) {
    if (['claude_unavailable', 'forbidden', 'not_granted'].includes(e?.code)) { canSend = 'off'; copyOut(text); }
    else confirmMsg(`Couldn’t send (${esc(e?.message || e?.code || 'unknown error')}). Try again.`, 'warn');
  } finally { button.disabled = false; button.textContent = was; refreshActions(); }
}
$('send').addEventListener('click', async () => {
  if (await deliver(pinsText(), $('send'), 'Sent to Claude. It will make the next version and reply in the chat.')) {
    $('say').value = ''; setPinning(false); refreshActions();
    if (store.db) { const at = new Date().toISOString(); for (const p of pins) store.patch(p.id, { sent: at }).catch(() => {}); }
  }
});
$('approve').addEventListener('click', () =>
  deliver(approveText(), $('approve'), 'Sent. Claude will make the print files and post them in the chat.'));

// re-read token colours when the theme changes
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyLayout());
new MutationObserver(() => applyLayout()).observe(root, { attributes: true, attributeFilter: ['data-theme'] });


/* ---------- capture mode ----------
   ?capture=1 hides the page chrome and draws one deterministic frame:
   view=3d|front|side|top|below  explode=0..1  layers=floor,walls,...  az=<deg>  el=<deg>
   zoom=<factor>  mode=studio|advanced. data-ready="1" on <html> once the frame is drawn. */
function capture() {
  const q = new URLSearchParams(location.search), num = (k, d) => (q.has(k) && isFinite(+q.get(k))) ? +q.get(k) : d;
  controls.autoRotate = false; controls.enableDamping = false; tween = null;
  if (q.get('mode') === 'advanced') { layout = 'advanced'; applyLayout(); }
  if (q.has('layers') && BUILD) {
    const on = new Set(q.get('layers').split(',').map(x => x.trim()).filter(Boolean));
    hiddenLayers.clear(); for (const l of LAYERS) if (!on.has(l)) hiddenLayers.add(l);
    applyLayers();
  }
  if (BUILD) { $('explode').value = String(Math.round(Math.min(1, Math.max(0, num('explode', 0))) * 1000)); setExplode(); }
  const name = { '3d': 'iso', iso: 'iso' }[q.get('view')] ?? q.get('view') ?? 'iso';
  const v = new THREE.Vector3(...(VIEWS[name] ?? VIEWS.iso));
  let az = Math.atan2(v.y, v.x) + THREE.MathUtils.degToRad(num('az', 0));
  let el = q.has('el') ? THREE.MathUtils.degToRad(num('el', 0)) : Math.atan2(v.z, Math.hypot(v.x, v.y));
  el = Math.max(-1.5, Math.min(1.5, el));
  const d = v.length() * lastSpan / Math.max(0.05, num('zoom', 1));
  camera.position.set(d * Math.cos(el) * Math.cos(az), d * Math.cos(el) * Math.sin(az), d * Math.sin(el));
  controls.target.set(0, 0, 0); controls.update();
  resize();
  let n = 0;
  const wait = () => ++n < 4 ? requestAnimationFrame(wait) : (root.dataset.ready = '1');
  requestAnimationFrame(wait);
}

/* ---------- start ---------- */
root.dataset.started = '1';
buildSteps();
buildPartButtons();
renderList();
if (BUILD) initBuild();
const firstShow = show(0);
if (root.classList.contains('capture')) firstShow.then(capture);
if (window.claude?.use) {
  // inside the Claude app: comments live in the page's db once it connects (null if it can't)
  window.claude.use('db').then(db => ready(db), () => ready(null));
  window.claude.use('comments').then(async c => {
    if (!c) return;
    comments = c;
    try { canSend = await c.canSendToClaude(); } catch { canSend = 'off'; }
    refreshActions();
  }, () => {});
} else {
  ready(null);                              // a file opened on its own
}
</script>
<script>
(() => {
  const mod = document.querySelector("script[type=module]"), done = () => document.documentElement.dataset.started === '1';
  mod.addEventListener('error', () => window.viewerFail('the 3D library could not be loaded. Check your connection and reload the page.'));
  window.addEventListener('error', e => { if (!done() && e.message) window.viewerFail(e.message.replace(/^(Uncaught )?(Error: )?/, '')); });
  setTimeout(() => { if (!done()) window.viewerFail('the 3D library is taking too long to load. Check your connection and reload the page.'); }, 20000);
})();
</script>
